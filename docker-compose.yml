services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ekyc_dashboard
      MYSQL_USER: ekyc_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
  web:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: mysql+pymysql://ekyc_app:${DB_PASSWORD}@db:3306/ekyc_dashboard?charset=utf8mb4
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports: ["8000:8000"]
volumes:
  dbdata:
